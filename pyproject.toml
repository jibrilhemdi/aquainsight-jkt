[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aquainsight-jakarta"
version = "1.0.0"
description = "Historical river water-quality exploration with transparent provenance"
requires-python = ">=3.11"
dependencies = ["streamlit>=1.50,<2", "pandas>=2.2,<4", "numpy>=2,<3", "plotly>=5.24,<8", "openpyxl>=3.1,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
